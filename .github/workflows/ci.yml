name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: vp run --filter @t3tools/desktop ensure:electron
      - run: vp check
      - run: vp run typecheck
      - run: vp run build:desktop

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: vp run --filter @t3tools/desktop ensure:electron
      - run: vp run test

  desktop_installer:
    name: Desktop installer (${{ matrix.platform }})
    needs: [preview_metadata, wsl_prebuild]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            target: AppImage
          - platform: win
            runner: windows-latest
            target: nsis
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: vp run --filter @t3tools/desktop ensure:electron
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - if: matrix.platform == 'win'
        uses: actions/download-artifact@v8
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild
      - name: Build installer
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          args=(--platform "${{ matrix.platform }}" --target "${{ matrix.target }}" --arch x64)
          args+=(--build-version "${{ needs.preview_metadata.outputs.version }}")
          if [[ "${{ matrix.platform }}" == win ]]; then args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node"); fi
          vp run dist:desktop:artifact "${args[@]}"
      - name: Verify installer output
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == linux ]]; then
            test -n "$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
            test -f release/nightly-linux.yml
          else
            test -n "$(find release -maxdepth 1 -name '*.exe' -print -quit)"
            test -n "$(find release -maxdepth 1 -name '*.exe.blockmap' -print -quit)"
            test -f release/nightly.yml
          fi
      - name: Upload preview updater assets
        uses: actions/upload-artifact@v7
        with:
          name: desktop-preview-${{ matrix.platform }}-x64
          path: |
            release/*.AppImage
            release/*.exe
            release/*.exe.blockmap
            release/nightly*.yml
          if-no-files-found: error

  preview_metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - id: meta
        shell: bash
        env:
          NIGHTLY_SHA: ${{ github.sha }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/resolve-nightly-release.ts --date "$(date -u +%Y%m%d)" --run-number "$NIGHTLY_RUN_NUMBER" --sha "$NIGHTLY_SHA" --github-output

  wsl_prebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - shell: bash
        run: |
          set -euo pipefail
          pty_package="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['apps/server'] }))")"
          pty_dir="$(dirname "$pty_package")"
          (cd "$pty_dir" && npx --yes node-gyp rebuild)
          mkdir -p wsl-prebuild && cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
      - uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error
