name: Sync upstream T3 Code

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'EricsenSemedo/t3code-jev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: merge
        name: Merge upstream main into a review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trusted_selector="$RUNNER_TEMP/select-upstream-batch.cjs"
          cp .github/scripts/select-upstream-batch.cjs "$trusted_selector"
          open_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head automation/upstream-main --state open --json number --jq '.[0].number')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --no-tags upstream +refs/heads/main:refs/remotes/upstream/main
          if git fetch origin automation/upstream-main:refs/remotes/origin/automation/upstream-main 2>/dev/null; then
            git checkout -B automation/upstream-main origin/automation/upstream-main
            before_sha="$(git rev-parse HEAD)"
            if ! git merge --no-ff --no-edit origin/main; then
              git merge --abort || true
              echo "The existing sync branch conflicts with main. No branch update or pull request was created." >&2
              exit 1
            fi
          else
            git checkout -B automation/upstream-main origin/main
            before_sha="$(git rev-parse HEAD)"
          fi
          actual_limit="$(node "$trusted_selector" --base origin/main --head HEAD --max-files 100)"
          actual_status="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).status)' "$actual_limit")"
          if [[ "$actual_status" != "within_limit" ]]; then
            echo "The actual review-branch diff exceeds the 100-file CodeRabbit limit: $actual_limit" >&2
            exit 1
          fi
          if [[ -n "$open_pr" ]]; then
            echo "Keeping the pending upstream batch stable; only refreshing its base if main advanced."
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            if [[ "$(git rev-parse HEAD)" == "$before_sha" ]]; then echo "updated=false" >> "$GITHUB_OUTPUT"; else echo "updated=true" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          selection="$(node "$trusted_selector" --base origin/main --upstream upstream/main --max-files 100)"
          selection_status="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).status)' "$selection")"
          case "$selection_status" in
            no_changes)
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "updated=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            oversized|conflict)
              echo "Upstream batch cannot be reviewed within the 100-file CodeRabbit limit: $selection" >&2
              exit 1
              ;;
            ready)
              upstream_commit="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).commit)' "$selection")"
              ;;
            *)
              echo "Unexpected upstream batch selection: $selection" >&2
              exit 1
              ;;
          esac
          if git merge --no-ff --no-edit "$upstream_commit"; then
            actual_limit="$(node "$trusted_selector" --base origin/main --head HEAD --max-files 100)"
            actual_status="$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).status)' "$actual_limit")"
            if [[ "$actual_status" != "within_limit" ]]; then
              echo "The actual review-branch diff exceeds the 100-file CodeRabbit limit: $actual_limit" >&2
              exit 1
            fi
            if git diff --quiet origin/main HEAD; then echo "has_changes=false" >> "$GITHUB_OUTPUT"; else echo "has_changes=true" >> "$GITHUB_OUTPUT"; fi
            if [[ "$(git rev-parse HEAD)" == "$before_sha" ]]; then echo "updated=false" >> "$GITHUB_OUTPUT"; else echo "updated=true" >> "$GITHUB_OUTPUT"; fi
          else
            git merge --abort || true
            echo "Upstream merge conflicted. No branch or pull request was created." >&2
            exit 1
          fi
      - name: Push review branch
        if: steps.merge.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git push origin HEAD:automation/upstream-main
      - name: Open an upstream sync pull request
        if: steps.merge.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          T3CODE_UPSTREAM_SYNC_TOKEN: ${{ secrets.T3CODE_UPSTREAM_SYNC_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head automation/upstream-main --state open --json number --jq '.[0].number')" ]]; then
            if [[ -z "${T3CODE_UPSTREAM_SYNC_TOKEN:-}" ]]; then
              echo "Refusing to create an upstream sync PR: set T3CODE_UPSTREAM_SYNC_TOKEN to a user token with pull-request write access so CodeRabbit can review the PR author." >&2
              exit 1
            fi
            GH_TOKEN="$T3CODE_UPSTREAM_SYNC_TOKEN" gh pr create --repo "$GITHUB_REPOSITORY" --base main --head automation/upstream-main --title "chore: sync upstream main" --body "Merges pingdotgg/t3code main while preserving Personal changes. Automatically merges only after the exact revision passes full CI, both installer builds and CodeRabbit approval, with no unresolved review threads. Conflicts or failed checks leave this PR pending. A successful merge triggers a Personal release."
          fi
      - name: Dispatch CI for the review branch
        if: steps.merge.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Recover if a previous sync pushed successfully but its dispatch failed.
          existing_run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch automation/upstream-main --event workflow_dispatch --commit "$(git rev-parse HEAD)" --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [[ -z "$existing_run" ]]; then gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref automation/upstream-main; fi
