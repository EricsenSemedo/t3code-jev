name: Jev desktop nightly

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jev-desktop-nightly
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.changes.outputs.has_changes }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      ref: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - id: changes
        shell: bash
        run: |
          tag="$(git tag --list 'v*-nightly.*' 'nightly-v*' --sort=-creatordate | head -n 1)"
          if [[ -n "$tag" && "$(git rev-parse "$tag^{commit}")" == "$(git rev-parse HEAD)" ]]; then echo "has_changes=false" >> "$GITHUB_OUTPUT"; else echo "has_changes=true" >> "$GITHUB_OUTPUT"; fi
      - id: meta
        if: steps.changes.outputs.has_changes == 'true'
        env:
          NIGHTLY_SHA: ${{ github.sha }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: node scripts/resolve-nightly-release.ts --date "$(date -u +%Y%m%d)" --run-number "$NIGHTLY_RUN_NUMBER" --sha "$NIGHTLY_SHA" --github-output

  verify:
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: vp run --filter @t3tools/desktop ensure:electron
      - run: vp check
      - run: vp run typecheck
      - run: vp run test

  wsl_prebuild:
    needs: preflight
    if: needs.preflight.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - shell: bash
        run: |
          set -euo pipefail
          pty_package="$(node -e "console.log(require.resolve('node-pty/package.json', { paths: ['apps/server'] }))")"
          pty_dir="$(dirname "$pty_package")"
          (cd "$pty_dir" && npx --yes node-gyp rebuild)
          mkdir -p wsl-prebuild && cp "$pty_dir/build/Release/pty.node" wsl-prebuild/pty.node
      - uses: actions/upload-artifact@v7
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild/pty.node
          if-no-files-found: error

  build:
    needs: [preflight, verify, wsl_prebuild]
    if: needs.preflight.outputs.has_changes == 'true' && needs.verify.result == 'success' && needs.wsl_prebuild.result == 'success'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
            target: AppImage
          - platform: win
            runner: windows-latest
            target: nsis
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: vp run --filter @t3tools/desktop ensure:electron
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - if: matrix.platform == 'win'
        uses: actions/download-artifact@v8
        with:
          name: wsl-node-pty-x64
          path: wsl-prebuild
      - name: Build updater-enabled artifact
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
        run: |
          args=(--platform "${{ matrix.platform }}" --target "${{ matrix.target }}" --arch x64 --build-version "${{ needs.preflight.outputs.version }}")
          if [[ "${{ matrix.platform }}" == win ]]; then args+=(--wsl-prebuild "$GITHUB_WORKSPACE/wsl-prebuild/pty.node"); fi
          vp run dist:desktop:artifact "${args[@]}"
      - name: Collect and verify assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-publish
          if [[ "${{ matrix.platform }}" == linux ]]; then
            test -n "$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"; test -f release/nightly-linux.yml
            cp release/*.AppImage release/nightly-linux.yml release-publish/
          else
            test -n "$(find release -maxdepth 1 -name '*.exe' -print -quit)"; test -n "$(find release -maxdepth 1 -name '*.exe.blockmap' -print -quit)"; test -f release/nightly.yml
            cp release/*.exe release/*.exe.blockmap release/nightly.yml release-publish/
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-x64
          path: release-publish/*
          if-no-files-found: error

  publish:
    needs: [preflight, build]
    if: needs.preflight.outputs.has_changes == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*-x64
          merge-multiple: true
          path: release-assets
      - shell: bash
        run: |
          test -n "$(find release-assets -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.exe.blockmap' -print -quit)"
          test -f release-assets/nightly-linux.yml && test -f release-assets/nightly.yml
      - uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: ${{ needs.preflight.outputs.name }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.exe.blockmap
            release-assets/*.yml
          fail_on_unmatched_files: true
